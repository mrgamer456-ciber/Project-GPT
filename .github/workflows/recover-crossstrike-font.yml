name: Diagnose CrossStrike font TEXR layout

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect font TEXR record without guessing offsets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import struct, hashlib, collections

          src = Path("samples/cross-strike/analysis/extracted/COMMON/TEXR_01.bin")
          data = src.read_bytes()
          out = Path("samples/cross-strike/font-recovery")
          out.mkdir(parents=True, exist_ok=True)

          count = struct.unpack_from("<I", data, 0)[0] if len(data) >= 4 else 0
          report = [
              "# CrossStrike font TEXR diagnostic",
              "",
              f"- File size: {len(data)} bytes (0x{len(data):X})",
              f"- First uint32: {count} (0x{count:X})",
              f"- SHA-256: {hashlib.sha256(data).hexdigest()}",
              f"- Expected 16 + count*0x4420: {16 + count*0x4420} bytes",
              f"- Exact expected-size match: {len(data) == 16 + count*0x4420}",
              "",
              "## First 0x600 bytes",
              "",
              "```text",
          ]
          for start in range(0, min(len(data), 0x600), 16):
              chunk = data[start:start+16]
              report.append(f"{start:06X}: " + " ".join(f"{b:02X}" for b in chunk))
          report += ["```", "", "## Record boundaries", ""]
          record_size = 0x4420
          for i in range(min(count, 3)):
              base = 0x10 + i * record_size
              report.append(f"- Record {i}: base=0x{base:X}, available={max(0, min(record_size, len(data)-base))} bytes")
              report.append(f"  - first 32: {data[base:base+32].hex(' ')}")
              report.append(f"  - last 32: {data[base+record_size-32:base+record_size].hex(' ')}")
          report += ["", "## Candidate offsets within record 0", ""]
          base = 0x10
          for off in (0x00, 0x10, 0x20, 0x40, 0x100, 0x410, 0x420, 0x500, 0x540):
              pos = base + off
              chunk = data[pos:pos+32]
              report.append(f"- +0x{off:03X} (absolute 0x{pos:X}): {chunk.hex(' ')}")
          report += ["", "## Byte frequency in first record", ""]
          rec = data[base:base+record_size]
          freq = collections.Counter(rec)
          report.append(", ".join(f"{b:02X}:{n}" for b,n in freq.most_common(24)))
          report += ["", "No PNG was generated and no source file was modified.", ""]
          target = out / "font-layout-diagnostic.md"
          target.write_text("\n".join(report), encoding="utf-8")
          print("\n".join(report))
          PY

      - name: Commit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/cross-strike/font-recovery/font-layout-diagnostic.md
          git commit -m "Diagnose CrossStrike font TEXR layout" || echo "No report changes"
          git push

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: CrossStrike-font-layout-diagnostic
          path: samples/cross-strike/font-recovery/font-layout-diagnostic.md
          if-no-files-found: error
          retention-days: 14
