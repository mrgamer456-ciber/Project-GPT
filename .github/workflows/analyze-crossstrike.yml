name: Analyze CrossStrike PS2 Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect ELF and PAK files
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib, math, re, struct
          
          root = Path("samples/cross-strike/PS2")
          out = Path("samples/cross-strike/analysis")
          out.mkdir(parents=True, exist_ok=True)
          report = []
          
          def add(s=""):
              report.append(str(s))
          
          def entropy(data):
              if not data: return 0.0
              counts = [0] * 256
              for b in data: counts[b] += 1
              n = len(data)
              return -sum((c/n)*math.log2(c/n) for c in counts if c)
          
          def printable_strings(data, minlen=5):
              return [m.group().decode("ascii", "replace") for m in re.finditer(rb"[ -~]{%d,}" % minlen, data)]
          
          add("# CrossStrike PS2 — análise estática")
          add("")
          add("Relatório gerado automaticamente pelo GitHub Actions. Nenhum arquivo original foi modificado.")
          add("")
          
          elf = root / "MAIN.ELF"
          if elf.exists():
              b = elf.read_bytes()
              add("## MAIN.ELF")
              add(f"- Tamanho: {len(b):,} bytes")
              add(f"- SHA-256: `{hashlib.sha256(b).hexdigest()}`")
              add(f"- Entropia global: {entropy(b):.4f} bits/byte")
              if b[:4] == b"\\x7fELF" and len(b) >= 52:
                  cls, enc = b[4], b[5]
                  endian = "<" if enc == 1 else ">" if enc == 2 else None
                  add(f"- ELF válido: sim; classe: {32 if cls == 1 else 64 if cls == 2 else 'desconhecida'}-bit; endian: {enc}")
                  if endian:
                      if cls == 1 and len(b) >= 52:
                          machine = struct.unpack_from(endian+"H", b, 18)[0]
                          entry = struct.unpack_from(endian+"I", b, 24)[0]
                          phoff, shoff = struct.unpack_from(endian+"II", b, 28)
                          phentsize, phnum, shentsize, shnum = struct.unpack_from(endian+"HHHH", b, 42)
                      elif cls == 2 and len(b) >= 64:
                          machine = struct.unpack_from(endian+"H", b, 18)[0]
                          entry = struct.unpack_from(endian+"Q", b, 24)[0]
                          phoff, shoff = struct.unpack_from(endian+"QQ", b, 32)
                          phentsize, phnum, shentsize, shnum = struct.unpack_from(endian+"HHHH", b, 54)
                      else:
                          machine = entry = phoff = shoff = phentsize = phnum = shentsize = shnum = None
                      add(f"- Machine: {machine}; entry point: `0x{entry:x}`" if entry is not None else "- Cabeçalho ELF parcialmente legível")
                      add(f"- Program headers: {phnum}; section headers: {shnum}")
                      if cls == 1 and phoff and phentsize and phnum:
                          add("- Segmentos (tipo, offset, vaddr, filesz, memsz):")
                          for i in range(min(phnum, 64)):
                              p = phoff + i*phentsize
                              if p+32 > len(b): break
                              typ, off, va, pa, fs, ms, fl, al = struct.unpack_from(endian+"IIIIIIII", b, p)
                              add(f"  - {i}: type={typ}, off=0x{off:x}, vaddr=0x{va:x}, filesz={fs}, memsz={ms}")
              else:
                  add("- Assinatura ELF não reconhecida.")
              ss = printable_strings(b)
              add(f"- Strings ASCII encontradas (mínimo 5 caracteres): {len(ss)}")
              add("### Strings relevantes (até 250)")
              keywords = re.compile(r"pak|asset|texture|model|mesh|sound|audio|map|load|file|camera|weapon|player|enemy|font|script|\.png|\.ps2|\.tm2|\.vag|\.adp", re.I)
              selected = [s for s in ss if keywords.search(s)]
              for s in selected[:250]: add(f"- `{s[:180]}`")
              if not selected:
                  for s in ss[:100]: add(f"- `{s[:180]}`")
              add("")
          
          add("## Arquivos PAK")
          pakdir = root / "ASSETS"
          for p in sorted(pakdir.glob("*.PAK")):
              b = p.read_bytes()
              head = b[:128]
              add(f"### {p.name}")
              add(f"- Tamanho: {len(b):,} bytes")
              add(f"- SHA-256: `{hashlib.sha256(b).hexdigest()}`")
              add(f"- Entropia global: {entropy(b):.4f} bits/byte")
              add(f"- Primeiros 128 bytes (hex): `{head.hex(' ')}`")
              add(f"- Primeiros 16 bytes (ASCII): `{''.join(chr(x) if 32 <= x < 127 else '.' for x in b[:16])}`")
              ss = printable_strings(b, 4)
              add(f"- Strings ASCII encontradas (mínimo 4 caracteres): {len(ss)}")
              for s in ss[:80]: add(f"  - `{s[:160]}`")
              add("")
          
          (out / "report.md").write_text("\\n".join(report)+"\\n", encoding="utf-8")
          print((out / "report.md").read_text(encoding="utf-8"))
          PY

      - name: Commit analysis report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/cross-strike/analysis/report.md
          if git diff --cached --quiet; then
            echo "Relatório sem alterações."
          else
            git commit -m "Add CrossStrike PS2 binary analysis report"
            git push
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossStrike-PS2-analise
          path: samples/cross-strike/analysis/report.md
          if-no-files-found: error
          retention-days: 14
