name: Extract CrossStrike PS2 ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download CrossStrike ZIP
        run: |
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/mrgamer456-ciber/Project-GPT/main/samples/cross-strike/CrossStrike_PS2.zip" \
            -o CrossStrike_PS2.zip

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -q CrossStrike_PS2.zip -d extracted
          echo "Arquivos extraídos:"
          find extracted -type f -printf '%P (%s bytes)\n' | sort

      - name: Upload extracted files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossStrike-PS2-extraido
          path: extracted/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
