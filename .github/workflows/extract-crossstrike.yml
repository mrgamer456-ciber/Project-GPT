name: Extract CrossStrike PS2 ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and extract CrossStrike
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/mrgamer456-ciber/Project-GPT/main/samples/cross-strike/CrossStrike_PS2.zip" \
            -o /tmp/CrossStrike_PS2.zip
          unzip -q /tmp/CrossStrike_PS2.zip -d extracted
          echo "Arquivos extraídos:"
          find extracted -type f -printf '%P (%s bytes)\n' | sort
          echo "Arquivos ELF e PAK encontrados:"
          find extracted -type f \( -iname 'MAIN.elf' -o -iname '*.pak' \) -print

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: CrossStrike-PS2-extraido
          path: extracted/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
