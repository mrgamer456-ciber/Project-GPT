name: Extract and verify combined CrossStrike PAK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract sections and compare with original BIN files
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import struct, csv, hashlib

          root = Path("samples/cross-strike")
          assets = root / "PS2" / "ASSETS"
          merged_path = root / "merged" / "CROSSSTRIKE_ALL.PAK"
          manifest_path = root / "merged" / "source-manifest.csv"
          out = root / "merged" / "extracted"
          out.mkdir(parents=True, exist_ok=True)

          data = merged_path.read_bytes()
          if len(data) < 16 or data[:4] != b"HJK1":
              raise SystemExit("Combined file has no HJK1 magic")
          version, count, reserved = struct.unpack_from("<III", data, 4)
          if version != 2:
              raise SystemExit(f"Unexpected HJK1 version: {version}")
          if 16 + count * 12 > len(data):
              raise SystemExit("Section table extends beyond archive")

          rows = list(csv.DictReader(manifest_path.open(newline="")))
          if len(rows) != count:
              raise SystemExit(f"Manifest has {len(rows)} rows but PAK has {count} sections")

          source_names = ["COMMON.PAK", "FLAT.PAK", "ISLAND.PAK", "KASBAH.PAK",
                          "OFFSHORE.PAK", "SNOWFIELD.PAK", "TRAINING.PAK"]
          source_sections = []
          for name in source_names:
              src = (assets / name).read_bytes()
              ver, n, _ = struct.unpack_from("<III", src, 4)
              if src[:4] != b"HJK1" or ver != 2:
                  raise SystemExit(f"Invalid source archive: {name}")
              for i in range(n):
                  p = 16 + i*12
                  tag = src[p:p+4]
                  off, size = struct.unpack_from("<II", src, p+4)
                  if off > len(src) or size > len(src)-off:
                      raise SystemExit(f"Invalid source section: {name} #{i}")
                  payload = src[off:off+size]
                  source_sections.append((name, i, tag, payload))

          if len(source_sections) != count:
              raise SystemExit(f"Source total {len(source_sections)} differs from merged count {count}")

          report = []
          extracted_total = 0
          for i, expected in enumerate(source_sections):
              src_name, src_index, expected_tag, expected_payload = expected
              pos = 16 + i*12
              tag = data[pos:pos+4]
              off, size = struct.unpack_from("<II", data, pos+4)
              if off < 16+count*12 or off > len(data) or size > len(data)-off:
                  raise SystemExit(f"Invalid merged section bounds at index {i}")
              payload = data[off:off+size]
              if tag != expected_tag:
                  raise SystemExit(f"Tag mismatch at merged section {i}: {tag!r} != {expected_tag!r}")
              if payload != expected_payload:
                  raise SystemExit(f"BIN mismatch at {src_name} section {src_index}")
              tag_name = tag.decode("ascii")
              folder = out / src_name.replace(".PAK", "")
              folder.mkdir(parents=True, exist_ok=True)
              target = folder / f"{src_index:02d}_{tag_name}.bin"
              target.write_bytes(payload)
              digest = hashlib.sha256(payload).hexdigest()
              expected_row = rows[i]
              if expected_row["source_pak"] != src_name or int(expected_row["source_index"]) != src_index:
                  raise SystemExit(f"Manifest ordering mismatch at section {i}")
              if expected_row["tag"] != tag_name or int(expected_row["size"]) != size or expected_row["sha256"] != digest:
                  raise SystemExit(f"Manifest hash/metadata mismatch at section {i}")
              report.append((src_name, src_index, tag_name, size, digest))
              extracted_total += 1

          with (root / "merged" / "extraction-verification.csv").open("w", newline="") as f:
              w = csv.writer(f)
              w.writerow(["source_pak", "source_index", "tag", "size", "sha256", "identical"])
              for row in report:
                  w.writerow([*row, "YES"])

          summary = [
              "# Combined PAK extraction verification", "",
              f"- Combined archive: {merged_path.name}",
              f"- HJK1 version: {version}",
              f"- Sections extracted: {extracted_total}",
              f"- Original PAKs checked: {len(source_names)}",
              "- Every extracted BIN was byte-for-byte identical to its original section.",
              "- Section order and repeated tags were preserved.",
              "- This verifies archive structure and payload integrity, not compatibility with the game's runtime loader.",
              "", "## Result", "", "**PASS — all 105 sections matched their original BIN data.**"
          ]
          (root / "merged" / "EXTRACTION-VERIFICATION.md").write_text("\\n".join(summary) + "\\n")
          print("\\n".join(summary))
          PY

      - name: Commit extracted BIN files and verification report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/cross-strike/merged/extracted samples/cross-strike/merged/extraction-verification.csv samples/cross-strike/merged/EXTRACTION-VERIFICATION.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract and verify combined CrossStrike PAK"
            git push
          fi
