<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS2 ELF Inspector</title>
<style>
body{margin:0;padding:22px;background:#101827;color:#edf4ff;font:16px system-ui}main{max-width:760px;margin:auto}section{background:#1b2940;padding:18px;border-radius:14px;margin:14px 0}button{padding:12px;border:0;border-radius:8px;background:#71e0bd;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#a9f3da}small{color:#aabbd3}
</style><main><h1>PS2 ELF Inspector</h1><p>Lab 002 · Project-GPT</p><section><p>Escolha um arquivo ELF do seu PS2. A análise é feita localmente no navegador.</p><input id="f" type="file"><p id="s">Aguardando arquivo…</p></section><section><h2>Resultado</h2><pre id="o">Nenhum arquivo analisado.</pre><button id="c">Copiar relatório</button></section><small>Não envia seus arquivos para a internet.</small></main>
<script>
const f=document.querySelector('#f'),s=document.querySelector('#s'),o=document.querySelector('#o'),c=document.querySelector('#c');let report='';
f.addEventListener('change',()=>{const file=f.files&&f.files[0];if(!file)return;s.textContent='Lendo apenas o cabeçalho ELF…';const r=new FileReader();r.onload=()=>{try{const b=r.result,a=new Uint8Array(b);if(a.length<16||a[0]!==0x7f||a[1]!==0x45||a[2]!==0x4c||a[3]!==0x46)throw Error('Assinatura ELF não encontrada.');const cls=a[4],enc=a[5];if(![1,2].includes(cls)||![1,2].includes(enc))throw Error('Classe ou endian do ELF inválido.');const min=cls===1?52:64;if(file.size<min||a.length<min)throw Error('Cabeçalho truncado: esperado pelo menos '+min+' bytes.');const v=new DataView(b),le=enc===1,m=v.getUint16(18,le),ehsize=v.getUint16(cls===1?40:52,le);if(ehsize<min)throw Error('Tamanho de cabeçalho ELF declarado é inválido ('+ehsize+').');const machine=({8:'MIPS',3:'Intel x86',40:'ARM',62:'x86-64'})[m]||'Desconhecida';let entry;if(cls===1)entry='0x'+v.getUint32(24,le).toString(16).toUpperCase();else{const low=v.getUint32(le?24:28,le),high=v.getUint32(le?28:24,le);entry='0x'+high.toString(16).padStart(8,'0')+low.toString(16).padStart(8,'0');entry=entry.toUpperCase();}const ps2=cls===1&&m===8&&le;report='Arquivo: '+file.name+'\nTamanho: '+file.size+' bytes\nFormato: '+(cls===1?'ELF32':'ELF64')+'\nEndian: '+(le?'Little-endian':'Big-endian')+'\nMáquina: '+machine+' ('+m+')\nTamanho do cabeçalho: '+ehsize+' bytes\nPonto de entrada: '+entry+'\nCompatibilidade provável com PS2: '+(ps2?'SIM — ELF32 MIPS little-endian':'NÃO CONFIRMADA')+'\n\nApenas os primeiros 64 bytes foram lidos. A identificação não garante que o ELF execute no console.';o.textContent=report;s.textContent='Análise concluída.';}catch(e){report=e.message;o.textContent=report;s.textContent='Não foi possível analisar.';}};r.onerror=()=>{report='Falha ao ler o cabeçalho.';o.textContent=report;s.textContent=report;};r.readAsArrayBuffer(file.slice(0,64));});
c.onclick=()=>{if(report&&navigator.clipboard)navigator.clipboard.writeText(report).then(()=>s.textContent='Relatório copiado!').catch(()=>s.textContent='Cópia não permitida neste navegador.');};
</script></main>
