<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project-GPT • ZIP Extractor</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:20px;font:16px system-ui;background:#10131a;color:#eef2f7}main{max-width:850px;margin:auto}h1{font-size:1.5rem}p{color:#b9c3d0;line-height:1.5}section{background:#1b2230;border:1px solid #303b4d;border-radius:14px;padding:16px;margin:14px 0}input,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #46536a;background:#101722;color:#fff;width:100%;margin:6px 0}button{background:#2867d8;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}small{color:#aeb9c8}.file{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #344052;overflow-wrap:anywhere}.file:last-child{border:0}.file button{width:auto;min-width:100px;margin:0}.status{white-space:pre-wrap;color:#a8d7ff}.muted{color:#9aa8ba}
</style>
</head>
<body><main>
<h1>📦 Project-GPT — ZIP Extractor</h1>
<p>Extrai arquivos ZIP no próprio navegador. Não envia o conteúdo para nenhum servidor. Use o ZIP do CrossStrike ou selecione outro arquivo.</p>
<section>
<label for="url">Link direto do ZIP (opcional)</label>
<input id="url" type="url" value="https://raw.githubusercontent.com/mrgamer456-ciber/Project-GPT/main/samples/cross-strike/CrossStrike_PS2.zip">
<button id="fetch">Baixar e extrair pelo link</button>
<hr>
<label for="file">Ou escolha um ZIP do celular</label>
<input id="file" type="file" accept=".zip,application/zip">
<button id="extract" disabled>Extrair ZIP selecionado</button>
<p id="status" class="status">Aguardando um ZIP…</p>
</section>
<section id="results" hidden>
<h2>Arquivos encontrados</h2>
<input id="filter" placeholder="Filtrar por nome ou extensão…">
<p id="summary" class="muted"></p>
<div id="list"></div>
<button id="report">Copiar relatório dos arquivos</button>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"></script>
<script>
const $=id=>document.getElementById(id);let zipEntries=[];
const LIMITS={archive:128*1024*1024,entries:5000,entry:128*1024*1024,total:256*1024*1024};
function say(t){$('status').textContent=t}
function safeName(n){return n.split(/[\\/]/).pop()||'arquivo.bin'}
async function responseBlobLimited(response){
 const length=Number(response.headers.get('content-length'));
 if(Number.isFinite(length)&&length>LIMITS.archive)throw Error('ZIP maior que 128 MiB.');
 const reader=response.body?.getReader();
 if(!reader){const blob=await response.blob();if(blob.size>LIMITS.archive)throw Error('ZIP maior que 128 MiB.');return blob;}
 const chunks=[];let total=0;
 try{while(true){const part=await reader.read();if(part.done)break;total+=part.value.byteLength;if(total>LIMITS.archive){await reader.cancel();throw Error('ZIP maior que 128 MiB.');}chunks.push(part.value);}}
 catch(e){try{await reader.cancel()}catch{}throw e;}
 return new Blob(chunks,{type:response.headers.get('content-type')||'application/zip'});
}
async function unpack(blob){
 if(blob.size>LIMITS.archive)throw Error('ZIP maior que 128 MiB.');
 say('Lendo ZIP…');$('results').hidden=true;
 const zip=await JSZip.loadAsync(blob),files=Object.entries(zip.files).filter(([,e])=>!e.dir);
 if(files.length>LIMITS.entries)throw Error('ZIP contém mais de 5.000 arquivos.');
 let total=0;const entries=[];
 for(const [name,e] of files){
  const size=Number(e._data?.uncompressedSize??0);
  if(!Number.isSafeInteger(size)||size<0)throw Error('Tamanho inválido declarado em '+name+'.');
  if(size>LIMITS.entry)throw Error('O arquivo '+name+' ultrapassa 128 MiB descompactado.');
  total+=size;if(total>LIMITS.total)throw Error('O conteúdo declarado ultrapassa 256 MiB descompactados.');
  entries.push({name,entry:e,size});
 }
 zipEntries=entries;
 zipEntries.sort((a,b)=>a.name.localeCompare(b.name));
 render();$('results').hidden=false;
 const pak=zipEntries.filter(x=>/\.pak$/i.test(x.name)).length;
 say('Extração concluída! '+zipEntries.length+' arquivos encontrados; '+pak+' arquivo(s) .pak.');
}
function extractEntryLimited(entry,maxBytes){
 return new Promise((resolve,reject)=>{
  const chunks=[];let total=0,settled=false;
  const stream=entry.internalStream('uint8array');
  const fail=error=>{if(settled)return;settled=true;stream.pause();chunks.length=0;reject(error)};
  stream.on('data',chunk=>{
   if(settled)return;
   total+=chunk.byteLength;
   if(total>maxBytes){fail(new Error('O conteúdo realmente descompactado ultrapassa '+(maxBytes/1024/1024)+' MiB.'));return;}
   chunks.push(chunk);
  }).on('error',fail).on('end',()=>{
   if(settled)return;settled=true;
   resolve(new Blob(chunks,{type:'application/octet-stream'}));
  });
  stream.resume();
 });
}
function render(){
 const q=$('filter').value.toLowerCase();const rows=zipEntries.filter(x=>x.name.toLowerCase().includes(q));
 $('summary').textContent=rows.length+' de '+zipEntries.length+' arquivos • '+zipEntries.filter(x=>/\.pak$/i.test(x.name)).length+' PAKs no total';
 $('list').innerHTML='';
 for(const x of rows){const d=document.createElement('div');d.className='file';const info=document.createElement('div');info.innerHTML='<strong></strong><br><small></small>';info.querySelector('strong').textContent=x.name;info.querySelector('small').textContent=(x.size||0).toLocaleString('pt-BR')+' bytes';const b=document.createElement('button');b.textContent='Baixar';b.onclick=async()=>{b.disabled=true;try{const blob=await extractEntryLimited(x.entry,LIMITS.entry);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=safeName(x.name);a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);say('Arquivo extraído: '+x.name)}catch(e){say('Não foi possível extrair '+x.name+': '+e.message)}finally{b.disabled=false}};d.append(info,b);$('list').append(d)}
}
$('fetch').onclick=async()=>{try{$('fetch').disabled=true;say('Baixando ZIP do GitHub…');const r=await fetch($('url').value);if(!r.ok)throw Error('HTTP '+r.status);await unpack(await responseBlobLimited(r))}catch(e){say('Não consegui baixar pelo link: '+e.message+'. Tente selecionar o ZIP manualmente.')}finally{$('fetch').disabled=false}};
$('file').onchange=()=>{$('extract').disabled=!$('file').files.length};
$('extract').onclick=async()=>{try{await unpack($('file').files[0])}catch(e){say('Erro ao extrair: '+e.message)}};
$('filter').oninput=render;
$('report').onclick=()=>{const t=zipEntries.map(x=>x.name+' | '+x.size+' bytes').join('\n');navigator.clipboard.writeText(t).then(()=>say('Relatório copiado! Cole aqui na conversa.')).catch(()=>say(t))};
</script></body></html>
